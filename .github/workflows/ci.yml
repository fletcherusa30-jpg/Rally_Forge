name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build check
        run: npm run build:check

      - name: Core tests
        run: npm test

      - name: Scanner regression tests
        run: npm run test:scanner-regression

      - name: Onboarding flow verification
        run: npm run test:onboarding-flow

      - name: Rate database validation
        run: npm run validate:rate-database
