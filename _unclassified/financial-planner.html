<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rally Forge - Financial Planner</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
    }
  </style>
  <link rel="stylesheet" href="frontend/modules/financial/module.css">
</head>
<body>
  <!-- Load the financial planner module -->
  <div id="financial-planner-container"></div>

  <script>
    // Load the financial planner module
    fetch('frontend/modules/financial/index.html')
      .then(response => response.text())
      .then(html => {
        document.getElementById('financial-planner-container').innerHTML = html;
        
        // Load the module script
        const script = document.createElement('script');
        script.src = 'frontend/modules/financial/module.js';
        document.body.appendChild(script);
      })
      .catch(error => {
        console.error('Error loading financial planner:', error);
        document.getElementById('financial-planner-container').innerHTML = 
          '<div style="color: white; text-align: center; padding: 2rem;">' +
          '<h1>Error Loading Financial Planner</h1>' +
          '<p>Please ensure the server is running.</p>' +
          '</div>';
      });
  </script>
</body>
</html>
