<section class="dashboard" data-dashboard>
  <link rel="stylesheet" href="modules/common/module.css" />
  <link rel="stylesheet" href="modules/dashboard/module.css" />
  <header class="dashboard-header">
    <h1>Dashboard</h1>
    <p>Quick access to your benefits tools.</p>
  </header>
  <section class="dashboard-grid">
    <div class="rf-card" data-profile>
      <h2>Profile Snapshot</h2>
      <div class="profile-details" data-profile-details>Loading profile...</div>
    </div>
    <div class="rf-card" data-summary>
      <h2>Benefits Summary</h2>
      <div class="summary-details" data-summary-details>Loading summary...</div>
    </div>
    <div class="rf-card" data-plan>
      <h2>Action Plan</h2>
      <div class="plan-summary" data-plan-summary>Loading plan...</div>
      <ul class="plan-list" data-plan-list></ul>
    </div>
  </section>
  <div class="dashboard-actions">
    <a class="rf-button" href="#/results">View Results</a>
    <button class="rf-button secondary" type="button" data-print>Print packet</button>
    <a class="rf-button secondary" href="#/onboarding">Re-run Onboarding</a>
  </div>
</section>
